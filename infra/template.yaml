AWSTemplateFormatVersion: "2010-09-09"
Description: Private S3 and CloudFront demo site with a least-privilege GitHub Actions OIDC deployment role.

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub organization or username.
    AllowedPattern: "[A-Za-z0-9_.-]+"
  GitHubRepo:
    Type: String
    Description: GitHub repository name.
    AllowedPattern: "[A-Za-z0-9_.-]+"
  GitHubBranch:
    Type: String
    Default: main
    Description: Branch permitted to deploy.
    AllowedPattern: "[A-Za-z0-9_./-]+"
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing token.actions.githubusercontent.com provider ARN, or leave blank to create it.

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]

Resources:
  DemoBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Purpose
          Value: aws-student-community-day-demo

  DemoOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: Signed CloudFront access to the private demo bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DemoDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${AWS::StackName} live demo"
        DefaultCacheBehavior:
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          TargetOriginId: demo-s3-origin
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt DemoBucket.RegionalDomainName
            Id: demo-s3-origin
            OriginAccessControlId: !GetAtt DemoOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        PriceClass: PriceClass_100

  DemoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DemoBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${DemoBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DemoDistribution}"

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Purpose
          Value: github-actions-oidc

  GitHubDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub "Deploy ${GitHubOwner}/${GitHubRepo} demo site from GitHub Actions."
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: DeployOnlyThisDemo
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListDemoBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DemoBucket.Arn
              - Sid: UpdateDemoObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${DemoBucket.Arn}/*"
              - Sid: InvalidateDemoDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DemoDistribution}"
      Tags:
        - Key: Purpose
          Value: aws-student-community-day-demo

Outputs:
  DemoUrl:
    Description: Public HTTPS URL for the live demo.
    Value: !Sub "https://${DemoDistribution.DomainName}"
  DemoBucketName:
    Description: Private S3 deployment bucket.
    Value: !Ref DemoBucket
  CloudFrontDistributionId:
    Description: Distribution ID used for cache invalidation.
    Value: !Ref DemoDistribution
  GitHubDeploymentRoleArn:
    Description: IAM role assumed by GitHub Actions using OIDC.
    Value: !GetAtt GitHubDeploymentRole.Arn
  CreatedGitHubOidcProvider:
    Description: Whether this stack created the account-level GitHub OIDC provider.
    Value: !If [CreateGitHubOidcProvider, "true", "false"]
