<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Beginner DevOps live demo using AWS CodePipeline" />
    <title>From Code to Cloud</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <nav aria-label="Demo status">
        <span class="brand">AWS STUDENT COMMUNITY DAY</span>
        <span id="status" class="status">LOADING</span>
      </nav>

      <section class="hero">
        <p class="eyebrow">ISLAMABAD / LIVE DEPLOYMENT</p>
        <h1 id="message">Ship with confidence.</h1>
        <p class="subhead">GitHub push. AWS CodePipeline. Live website. No server setup.</p>
        <div class="release">
          <span>RELEASE</span>
          <strong id="version">v1.0</strong>
        </div>
      </section>

      <section class="pipeline" aria-label="Deployment pipeline">
        <span>SOURCE</span><i></i><span>CHECK</span><i></i><span>DEPLOY</span><i></i><span>LIVE</span>
      </section>

      <footer>
        <span>Built live with CloudFormation + CodePipeline</span>
        <span id="timestamp">Waiting for pipeline</span>
      </footer>
    </main>
  </body>
</html>
