<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Live CI/CD demo for AWS Student Community Day Islamabad" />
    <title>From Code to Cloud</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <nav aria-label="Demo status">
        <span class="brand">AWS STUDENT COMMUNITY DAY</span>
        <span id="status" class="status">LOADING</span>
      </nav>

      <section class="hero">
        <p class="eyebrow">ISLAMABAD / LIVE DEPLOYMENT</p>
        <h1 id="message">Ship with confidence.</h1>
        <p class="subhead">One commit. One automated pipeline. One real AWS deployment.</p>
        <div class="release">
          <span>RELEASE</span>
          <strong id="version">v1.0</strong>
        </div>
      </section>

      <section class="pipeline" aria-label="Deployment pipeline">
        <span>CODE</span><i></i><span>CHECK</span><i></i><span>DEPLOY</span><i></i><span>OBSERVE</span>
      </section>

      <footer>
        <span>Built live by FarhanAshrafDev</span>
        <span id="timestamp">Waiting for pipeline</span>
      </footer>
    </main>
  </body>
</html>
